<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Profissional</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1220;
  --card:#121a2b;
  --card-2:#0f172a;
  --accent:#22c55e;
  --accent-2:#16a34a;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --border:rgba(255,255,255,0.06);
}

*{box-sizing:border-box}

body {
    margin:0;
    font-family:'Inter', sans-serif;
    background: radial-gradient(circle at 20% 20%, #111827, #020617);
    color:var(--text);
}

header {
    padding: 30px 20px 10px;
    text-align: center;
}

header h1{
    margin:0;
    font-size:26px;
}

header p{
    margin-top:6px;
    color:var(--muted);
    font-size:14px;
}

.wrapper{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:linear-gradient(145deg,var(--card),var(--card-2));
    border:1px solid var(--border);
    padding:20px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.card h2{
    margin-top:0;
    font-size:18px;
}

label{
    font-size:13px;
    color:var(--muted);
    display:block;
    margin-top:12px;
}

input, select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#020617;
    color:white;
    margin-top:5px;
}

input:focus, select:focus{
    outline:none;
    border:1px solid var(--accent);
}

.quick-buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.quick-buttons button{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:none;
    background:#1e293b;
    color:white;
    cursor:pointer;
}

.quick-buttons button:hover{
    background:#334155;
}

.main-btn{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    font-weight:bold;
    cursor:pointer;
}

.result{
    font-size:15px;
    line-height:1.6;
}

.result strong{
    font-size:18px;
}

.highlight{
    color:var(--accent);
}

.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    padding:16px;
    border-radius:50%;
    font-size:20px;
    text-decoration:none;
    color:white;
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
  <h1>Calculadora de Instalação</h1>
  <p>Calcule gás, metragem e orçamento em segundos</p>
</header>

<div class="wrapper">

<div class="grid">

<div class="card">
<h2>Dados da Instalação</h2>

<label>Marca</label>
<select>
<option>LG</option>
<option>Samsung</option>
<option>Gree</option>
<option>Daikin</option>
<option>Midea</option>
<option>Electrolux</option>
<option>Consul</option>
<option>Springer Carrier</option>
<option>Agratto</option>
</select>

<label>BTU</label>
<select id="btu">
<option value="20">9000 - 12000</option>
<option value="30">18000 - 24000</option>
<option value="40">30000+</option>
</select>

<label>Metragem (metros)</label>
<input type="number" id="metros" placeholder="Digite ou use os botões abaixo">

<div class="quick-buttons">
<button onclick="setMetro(3)">3m</button>
<button onclick="setMetro(5)">5m</button>
<button onclick="setMetro(7)">7m</button>
<button onclick="setMetro(10)">10m</button>
</div>

<label>Tipo de gás</label>
<select>
<option>R22</option>
<option>R410A</option>
<option>R32</option>
</select>

<label>Diâmetro do tubo</label>
<select id="tubo">
<option value="1">Padrão</option>
<option value="1.2">Médio</option>
<option value="1.5">Grande</option>
</select>

<button class="main-btn" onclick="calcular()">Calcular Agora</button>

</div>

<div class="card">
<h2>Resultado</h2>
<div class="result" id="resultado">
Preencha os dados para ver o cálculo
</div>

<hr style="margin:20px 0;border:0;border-top:1px solid var(--border)">

<label>Preço por metro (R$)</label>
<input type="number" id="precoMetro">

<label>Preço do gás por kg (R$)</label>
<input type="number" id="precoGas">

<button class="main-btn" onclick="calcular()">Atualizar Orçamento</button>

</div>

</div>

</div>

<a class="whatsapp" href="https://wa.me/SEUNUMERO" target="_blank">💬</a>

<script>
function setMetro(valor){
  document.getElementById('metros').value = valor;
}

function calcular(){
  let metros = parseFloat(document.getElementById('metros').value);
  let cargaBase = parseFloat(document.getElementById('btu').value);
  let fator = parseFloat(document.getElementById('tubo').value);
  let precoMetro = parseFloat(document.getElementById('precoMetro').value) || 0;
  let precoGas = parseFloat(document.getElementById('precoGas').value) || 0;

  if(!metros){
    alert('Informe a metragem');
    return;
  }

  let excedente = metros > 3 ? metros - 3 : 0;
  let carga = excedente * cargaBase * fator;
  let kg = carga/1000;

  let custoMetro = excedente * precoMetro;
  let custoGas = kg * precoGas;
  let total = custoMetro + custoGas;

  document.getElementById('resultado').innerHTML = `
  📏 Tubulação excedente: <strong>${excedente}m</strong><br>
  🧊 Gás necessário: <strong class="highlight">${carga.toFixed(0)}g (${kg.toFixed(2)}kg)</strong><br><br>

  💰 Custo tubulação: R$ ${custoMetro.toFixed(2)}<br>
  🧊 Custo gás: R$ ${custoGas.toFixed(2)}<br><br>

  <strong class="highlight">TOTAL: R$ ${total.toFixed(2)}</strong>
  `;
}
</script>

</body>
</html>
